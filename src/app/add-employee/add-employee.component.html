<div class="card shadow-sm" style="max-width: 600px; margin: 0 auto;">
  <div class="card-header bg-success text-white">
    <h2 class="mb-0">Add Employee</h2>
  </div>
  <div class="card-body">
    <a class="btn btn-secondary btn-sm mb-3" routerLink="/employees">← Back to Employees</a>

    <form (ngSubmit)="save()" class="mt-3">
      <div class="mb-3">
        <label for="name" class="form-label">Name:</label>
        <input id="name" name="name" class="form-control" [(ngModel)]="employee.name" required>
      </div>

      <div class="mb-3">
        <label for="location" class="form-label">Location:</label>
        <input id="location" name="location" class="form-control" [(ngModel)]="employee.location" required>
      </div>

      <div class="mb-3">
        <label for="email" class="form-label">Email:</label>
        <input id="email" name="email" type="email" class="form-control" [(ngModel)]="employee.email" required>
      </div>

      <div class="mb-3">
        <label for="mobile" class="form-label">Mobile:</label>
        <input id="mobile" name="mobile" type="tel" class="form-control" [(ngModel)]="employee.mobile" required>
      </div>

      <div class="d-grid gap-2 d-sm-flex justify-content-sm-start mt-4">
        <button type="submit" class="btn btn-success">Save</button>
        <a routerLink="/employees" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
